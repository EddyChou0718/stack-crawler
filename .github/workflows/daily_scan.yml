name: Stock Triple Growth Scanner

on:
  schedule:
    # 設定定時執行 (Cron 格式: 分 時 日 月 週)，此為台灣時間每週一早上 08:00
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scanner
      run: python main.py

    - name: Upload Result
      uses: actions/upload-artifact@v3
      with:
        name: stock-report
        path: result.csv
